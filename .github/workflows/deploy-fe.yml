name: Deploy Frontend

on:
  push:
    branches:
      - develop
    paths:
      - "quiz-fe/**"
      - ".github/workflows/deploy-fe.yml"
  workflow_dispatch:

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: ./quiz-fe
          file: ./quiz-fe/Dockerfile
          target: prod
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/quiz-fe:dev
          build-args: |
            VITE_API_BASE_URL=${{ vars.DEV_FE_API_BASE_URL || format('http://{0}:8000/api', secrets.DEV_SERVER_HOST) }}

      - name: Deploy dev
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_PORT }}
          script: |
            set -e
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            cd /var/www/quiz-fe-dev
            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d --remove-orphans
