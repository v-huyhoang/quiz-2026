services:
  app:
    image: yourname/quiz-be:dev
    container_name: quiz-be-dev
    ports:
      - "8000:80"
      - "8080:8080"
    env_file:
      - .env.dev
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: quiz-mysql-dev
    environment:
      MYSQL_DATABASE: quiz_dev
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: quiz_user
      MYSQL_PASSWORD: change_dev_password
    volumes:
      - mysql_data_dev:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: quiz-redis-dev
    restart: unless-stopped

volumes:
  mysql_data_dev:
