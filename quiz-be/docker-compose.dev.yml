services:
  app:
    image: ${DOCKERHUB_USERNAME}/quiz-be:dev
    container_name: quiz-be-dev
    ports:
      - "8000:80"
      - "8080:8080"
    volumes:
      - "${STORAGE_PUBLIC_PATH:-./storage-public-dev}:/var/www/html/storage/app/public"
    env_file:
      - .env.dev
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: quiz-mysql-dev
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-quiz_dev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-quiz_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data_dev:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: quiz-redis-dev
    restart: unless-stopped

volumes:
  mysql_data_dev:
