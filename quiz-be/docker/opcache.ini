[opcache]
opcache.enable=1
opcache.enable_cli=0

; 128MB shared memory for compiled bytecode.
; Laravel + vendor typically compiles 8000–12000 files; 128MB is sufficient.
opcache.memory_consumption=128

; Allow up to 20000 script slots. Laravel + all vendor files fit within this.
opcache.max_accelerated_files=20000

; 16MB for interned strings (class names, method names, string literals).
; Reduces per-request memory usage when many workers share the same strings.
opcache.interned_strings_buffer=16

; Check file modification timestamps every 60 seconds.
; In production (no volume mount) files never change → effectively a no-op.
; In local dev (volume mount) code changes are picked up within 60 seconds.
opcache.validate_timestamps=1
opcache.revalidate_freq=60
