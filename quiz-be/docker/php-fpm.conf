[www]
; --- Process manager ---
; dynamic: spawn/kill workers based on load. Better than static for variable traffic.
pm = dynamic

; Max concurrent PHP workers.
; Budget: 4096MB total - ~560MB (OS + Nginx + Reverb + queue worker + OPcache) = ~3500MB available
; Each Laravel worker (OPcache warm) uses ~50MB incremental RSS → 3500 / 50 = 70 max
; Capped at 50: leaves headroom for Reverb connection spikes and avoids swap.
pm.max_children = 50

; Workers to pre-fork at startup — ready to absorb the initial request burst immediately.
pm.start_servers = 10

; Always maintain at least 5 idle workers to absorb sudden spikes without cold-start lag.
pm.min_spare_servers = 5

; Kill idle workers beyond this count during low-traffic periods to reclaim memory.
pm.max_spare_servers = 20

; Restart a worker after N requests. Prevents gradual memory growth from minor leaks.
; 500 requests × ~50MB peak per worker = bounded memory per worker lifecycle.
pm.max_requests = 500

; Kill spare workers idle longer than this — frees memory between game sessions.
pm.process_idle_timeout = 30s

; Hard deadline per request. Kills a stuck PHP process (e.g. hung DB connection).
; Set above any expected legitimate request duration (submit flow: ~50ms, admin: ~200ms).
request_terminate_timeout = 30
