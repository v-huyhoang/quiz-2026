[program:reverb]
command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/html
; Reverb runs in its own container (quiz-reverb-local) via docker-compose.
; autostart=false prevents a duplicate reverb process inside the app container.
autostart=false
autorestart=false
user=www-data
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0